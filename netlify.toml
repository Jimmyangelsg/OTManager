[build]
  base    = "frontend"
  command = "yarn install --frozen-lockfile && yarn build"
  publish = "frontend/build"

[build.environment]
  NODE_VERSION = "20"
  CI           = "true"

# SPA fallback so React Router routes resolve client-side
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# IMPORTANT: set REACT_APP_BACKEND_URL in the Netlify UI before building,
# pointing to your deployed backend (e.g. https://ots-backend.onrender.com).
